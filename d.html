<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
body{background:#1a1a1a;text-align:center;color:white;font-family:sans-serif;}
#score{font-size:22px;margin:10px 0;}
#game{border:3px solid #4CAF50;background:#000;}
.btn{width:70px;height:70px;margin:5px;font-size:22px;background:#222;color:#fff;border:2px solid #4CAF50;border-radius:8px;}
</style>
</head>
<body>
<div id="score">得分：0</div>
<canvas id="game" width="300" height="500"></canvas>
<br>
<button class="btn" onclick="up()">↑</button><br>
<button class="btn" onclick="left()">←</button>
<button class="btn" onclick="right()">→</button><br>
<button class="btn" onclick="down()">↓</button>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const size=15;
let snake=[{x:150,y:250}];
let dx=size,dy=0;
let food=randomFood();
let score=0;
function randomFood(){return{x:Math.floor(Math.random()*(canvas.width/size))*size,y:Math.floor(Math.random()*(canvas.height/size))*size};}
function draw(){
ctx.fillStyle="#000";
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="#4CAF50";
snake.forEach(p=>ctx.fillRect(p.x,p.y,size,size));
ctx.fillStyle="#f44336";
ctx.fillRect(food.x,food.y,size,size);
}
function move(){
let head={x:snake[0].x+dx,y:snake[0].y+dy};
if(head.x<0||head.x>=canvas.width||head.y<0||head.y>=canvas.height){alert("结束！得分："+score);clearInterval(run);location.reload();}
for(let i=1;i<snake.length;i++){if(head.x==snake[i].x&&head.y==snake[i].y){alert("结束！得分："+score);clearInterval(run);location.reload();}}
snake.unshift(head);
if(head.x==food.x&&head.y==food.y){score+=10;document.getElementById("score").innerText="得分："+score;food=randomFood();}else{snake.pop();}
draw();
}
function up(){if(dy!=size){dx=0;dy=-size;}}
function down(){if(dy!=-size){dx=0;dy=size;}}
function left(){if(dx!=size){dx=-size;dy=0;}}
function right(){if(dx!=-size){dx=size;dy=0;}}
let run=setInterval(move,130);
draw();
</script>
</body>
</html>
