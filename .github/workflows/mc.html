<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>触控贪吃蛇</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#1a1a1a;text-align:center;padding:10px}
        #game{
            border:3px solid #444;
            background:#000;
            display:block;
            margin:0 auto;
            touch-action:none
        }
        .info{color:#fff;font-size:18px;margin:10px 0}
    </style>
</head>
<body>
    <div class="info">分数：<span id="score">0</span></div>
    <canvas id="game" width="320" height="500"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreText = document.getElementById('score');

        const size = 16;
        let snake = [{x:160,y:250}];
        let dx = 0;
        let dy = -size;
        let food = {};
        let score = 0;
        let gameLoop;

        // 生成食物
        function spawnFood(){
            food.x = Math.floor(Math.random()*(canvas.width/size))*size;
            food.y = Math.floor(Math.random()*(canvas.height/size))*size;
        }

        // 主循环
        function update(){
            const head = {x:snake[0].x+dx, y:snake[0].y+dy};
            snake.unshift(head);

            // 吃到食物
            if(head.x===food.x && head.y===food.y){
                score+=10;
                scoreText.textContent=score;
                spawnFood();
            }else{
                snake.pop();
            }

            // 撞墙/撞自己
            if(head.x<0 || head.x>=canvas.width || head.y<0 || head.y>=canvas.height || snake.slice(1).some(s=>s.x===head.x&&s.y===head.y)){
                clearInterval(gameLoop);
                alert('游戏结束！分数：'+score);
                return;
            }

            // 绘制
            ctx.fillStyle='#000';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            
            ctx.fillStyle='#0f0';
            snake.forEach(s=>ctx.fillRect(s.x,s.y,size-1,size-1));
            
            ctx.fillStyle='#f00';
            ctx.fillRect(food.x,food.y,size-1,size-1);
        }

        // 手机触控控制
        canvas.addEventListener('touchstart', e=>{
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            const cx = canvas.width/2;
            const cy = canvas.height/2;

            if(Math.abs(x-cx)>Math.abs(y-cy)){
                if(x<cx && dx!==size){dx=-size;dy=0}
                else if(x>cx && dx!==-size){dx=size;dy=0}
            }else{
                if(y<cy && dy!==size){dy=-size;dx=0}
                else if(y>cy && dy!==-size){dy=size;dx=0}
            }
        });

        spawnFood();
        gameLoop = setInterval(update, 80);
    </script>
</body>
</html>
